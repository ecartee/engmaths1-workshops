<!DOCTYPE html>
<!--
  Worksheet audit harness. Not part of the published site: it is loaded by
  tools/audit.py in a headless browser.

  Why this exists: the things that break a worksheet (a page too full for A4,
  a preview laid out for the wrong paper, a missing alt attribute, a faint
  curve label) are invisible in the normal scrollable view and awkward to
  eyeball in print preview. This measures them.

  It loads the worksheet, follows its own print-preview link (so nobody has to
  know the `?printpreview=worksheetNNwks-3` id), polls until MathJax and the
  workspace-sizing JS have settled, and measures the printed pages. It then
  loads the normal scrollable view in a phone-width frame and looks for
  anything wider than the column (a long displayed equation, a wide table),
  which a phone cuts off at the right-hand edge. Finally it sends the
  measurements back to tools/audit.py.
-->
<html lang="en">
<head><meta charset="utf-8"><title>worksheet audit</title></head>
<body>
<iframe id="f" style="width:1100px;height:1400px;border:0"></iframe>
<iframe id="phone" style="width:360px;height:800px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
const POLL_MS = 250;           // how often to look at the print preview
const STABLE_POLLS = 2;        // consecutive identical layouts needed to settle
const SETTLE_TIMEOUT_MS = 60000;
const PHONE_WIDTH = 360;       // narrowest common phone screen, in CSS px (iPhones are 375-430)
const params = new URLSearchParams(location.search);
const target = params.get('t');
const f = document.getElementById('f');
let followed = false;

function report(result) {
  document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(result);
  fetch('/__audit_result', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(result)
  });
}

function lum(r, g, b) {
  const c = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * c(r) + 0.7152 * c(g) + 0.0722 * c(b);
}
function ratioOf(l1, l2) {
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
// Mathematics is measured by its MathJax container, not the pieces inside.
// A tall bracket is drawn as top and bottom glyphs plus a repeated middle
// piece inside a clipped box; in Firefox that hidden piece's own zero-height
// box can sit below the page footer although nothing is drawn there.
function insideMath(el) {
  return !!(el.parentElement && el.parentElement.closest('mjx-container'));
}

function toPx(length) {
  const m = /^([\d.]+)\s*(in|cm|mm|pt|px)?$/.exec((length || '').trim());
  if (!m) return null;
  const perUnit = { in: 96, cm: 96 / 2.54, mm: 96 / 25.4, pt: 96 / 72, px: 1 };
  return parseFloat(m[1]) * perUnit[m[2] || 'px'];
}

function measure(settled) {
  const doc = f.contentDocument, win = f.contentWindow;
  const cv = doc.createElement('canvas');
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cv.width = cv.height = 1;
  const toRGB = c => { cx.fillStyle = '#000'; cx.fillStyle = c; cx.fillRect(0, 0, 1, 1);
                       const d = cx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]]; };
  const bgOf = e => {
    let n = e;
    while (n && n.nodeType === 1) {
      const bg = win.getComputedStyle(n).backgroundColor;
      if (bg && !/rgba\(0, 0, 0, 0\)|transparent/.test(bg)) return bg;
      n = n.parentElement;
    }
    return 'rgb(255,255,255)';
  };
  const contrast = (fg, bg) => ratioOf(lum(...toRGB(fg)), lum(...toRGB(bg)));

  // --- page size and fit ---------------------------------------------------
  // Everything on a page, footer included, must end above the bottom margin.
  // scrollHeight is useless here (overflow is visible), so take the lowest
  // rendered edge of any laid-out descendant relative to the page top
  // (mathematics by its MathJax container: see insideMath).
  //
  // PreTeXt stretches or squeezes every workspace on a page by the same factor
  // to fill it. A factor below 1 means the page is over-full: students get
  // less working space than the source asked for.
  const pages = Array.from(doc.querySelectorAll('.onepage')).map((pg, i) => {
    const box = pg.getBoundingClientRect();
    const limit = box.height - parseFloat(win.getComputedStyle(pg).paddingBottom);
    let bottom = 0;
    pg.querySelectorAll('*').forEach(el => {
      if (el.offsetParent === null) return;              // hidden / not laid out
      if (insideMath(el)) return;
      const b = el.getBoundingClientRect().bottom - box.top;
      if (b > bottom) bottom = b;
    });
    let scale = null;
    pg.querySelectorAll('.workspace').forEach(ws => {
      const authored = toPx(ws.getAttribute('data-space') || ws.style.height);
      if (!authored) return;
      const s = ws.getBoundingClientRect().height / authored;
      if (scale === null || s < scale) scale = s;
    });
    return {
      page: i + 1,
      width: Math.round(box.width), height: Math.round(box.height),
      bottom: Math.round(bottom), limit: Math.round(limit), over: bottom > limit + 1,
      scale: scale === null ? null : +scale.toFixed(2)
    };
  });

  // --- print defaults ------------------------------------------------------
  const shown = sel => {
    const el = doc.querySelector(sel);
    return !!el && win.getComputedStyle(el).display !== 'none';
  };
  const print = {
    paper: doc.body.classList.contains('a4') ? 'a4'
         : (doc.body.classList.contains('letter') ? 'letter' : 'unknown'),
    header: shown('.first-page-header'),
    footer: shown('.first-page-footer'),
    footerText: (doc.querySelector('.first-page-footer') || { textContent: '' }).textContent.trim()
  };

  // --- solutions must not be published -------------------------------------
  const solutions = doc.querySelectorAll(
    '.solution, .answer, .hint, .solution-like, .solutions').length;

  // --- alt text ------------------------------------------------------------
  const images = Array.from(doc.querySelectorAll('.onepage img')).map(im => ({
    src: im.getAttribute('src').split('/').pop(),
    alt: im.getAttribute('alt') || '',
    missing: !(im.getAttribute('alt') || '').trim()
  }));

  // --- fonts + text contrast ----------------------------------------------
  // Mathematics is exempt: MathJax sets it in its own TeX fonts.
  const text = {};
  doc.querySelectorAll('.onepage *').forEach(el => {
    if (el.closest('mjx-container, .MathJax, math')) return;
    if (!Array.from(el.childNodes).some(n => n.nodeType === 3 && n.textContent.trim())) return;
    if (!el.offsetParent) return;
    const cs = win.getComputedStyle(el);
    const fam = cs.fontFamily;
    const key = cs.color + '|' + bgOf(el) + '|' + fam;
    if (text[key]) { text[key].n++; return; }
    const px = parseFloat(cs.fontSize), wt = parseInt(cs.fontWeight) || 400;
    const large = px >= 24 || (px >= 18.66 && wt >= 700);
    const r = contrast(cs.color, bgOf(el));
    text[key] = {
      font: fam.split(',')[0].replace(/"/g, ''),
      serif: /serif/i.test(fam) && !/sans-serif/i.test(fam),
      size: cs.fontSize, ratio: +r.toFixed(2), need: large ? 3.0 : 4.5,
      fail: r < (large ? 3.0 : 4.5),
      sample: el.textContent.trim().slice(0, 28), n: 1
    };
  });

  // --- ink inside images ---------------------------------------------------
  // Plotting tools' default blue/green label colours sit near 3.2-3.8:1 on
  // white and fail the 4.5:1 text threshold. Sample each image so that gets
  // caught instead of eyeballed.
  //
  // Group colours into families by dominant channel and judge the DARKEST
  // reasonably-common member of each. A stroke or label's core pixels are the
  // darkest of their hue; pale fills and antialiased edges are lighter
  // variants, so they drop out on their own.
  const ink = [];
  const white = lum(255, 255, 255);
  Array.from(doc.querySelectorAll('.onepage img')).forEach(im => {
    if (!im.naturalWidth) return;
    const c2 = doc.createElement('canvas');
    c2.width = im.naturalWidth; c2.height = im.naturalHeight;
    const x2 = c2.getContext('2d', { willReadFrequently: true });
    x2.drawImage(im, 0, 0);
    let data;
    try { data = x2.getImageData(0, 0, c2.width, c2.height).data; } catch (e) { return; }

    const buckets = {};
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if (a < 200) continue;
      if (Math.max(r, g, b) - Math.min(r, g, b) < 40) continue;   // skip greys/black/white
      const k = (r >> 3 << 3) + ',' + (g >> 3 << 3) + ',' + (b >> 3 << 3);
      buckets[k] = (buckets[k] || 0) + 1;
    }
    const floor = Math.max(100, 0.0004 * im.naturalWidth * im.naturalHeight);
    const families = {};
    Object.entries(buckets).forEach(([k, n]) => {
      if (n < floor) return;                                       // antialiasing speckle
      const [r, g, b] = k.split(',').map(Number);
      const fam = r >= g && r >= b ? 'red' : (g >= b ? 'green' : 'blue');
      const l = lum(r, g, b);
      if (!families[fam] || l < families[fam].l) families[fam] = { k, n, l };
    });
    Object.entries(families).forEach(([fam, v]) => {
      const rr = ratioOf(v.l, white);
      // Strictly, WCAG lets a bare curve sit at 3:1, but a coloured curve
      // almost always carries a label in the same colour, and label text
      // needs 4.5:1.
      ink.push({
        src: im.getAttribute('src').split('/').pop(),
        family: fam, rgb: v.k, px: v.n, ratio: +rr.toFixed(2),
        verdict: rr < 3.0 ? 'FAIL' : (rr < 4.5 ? 'FAIL_LABEL' : 'OK')
      });
    });
  });

  return { pages, print, solutions, images, text: Object.values(text), ink, settled };
}

// --- phone width -----------------------------------------------------------
// MathJax 3 cannot break a displayed equation across lines, so a long one is
// wider than a phone's column. PreTeXt lets it scroll sideways, but phones
// hide the scrollbar, so readers just see it cut off. Load the normal view in
// a phone-width frame and report anything wider than its box or past the
// right-hand edge of the screen.
function placeOf(el) {
  const ex = el.closest('article.exercise');
  if (ex) {
    const num = ex.querySelector('.codenumber');
    const task = el.closest('article.task');
    const part = task && task.querySelector('.codenumber');
    return 'Exercise ' + (num ? num.textContent.trim().replace(/\.$/, '') : ex.id)
         + (part ? part.textContent.trim().replace(/\.$/, '') : '');
  }
  const block = el.closest('article, section');
  const title = block && block.querySelector('.title');
  return title ? title.textContent.trim() : (block && block.id) || 'page';
}

function phoneOverflow(doc) {
  const screen = doc.documentElement.clientWidth;
  const found = {};
  doc.querySelectorAll('.ptx-content .displaymath, .ptx-content .tabular-box, '
                     + '.ptx-content .image-box, .ptx-content img, .ptx-content pre').forEach(el => {
    if (el.offsetParent === null) return;              // hidden (e.g. a closed knowl)
    const right = el.getBoundingClientRect().right;
    if (el.scrollWidth <= el.clientWidth + 1 && right <= screen + 1) return;
    const kind = el.matches('.displaymath') ? 'displayed equation'
               : el.matches('.tabular-box') ? 'table'
               : el.matches('pre') ? 'code block' : 'image';
    const key = placeOf(el) + '|' + kind;
    const wide = Math.max(el.scrollWidth, Math.round(right - el.getBoundingClientRect().left));
    if (!found[key] || wide > found[key].width) {
      found[key] = { place: placeOf(el), kind, width: wide, room: el.clientWidth };
    }
  });
  return Object.values(found);
}

async function checkPhone() {
  const ph = document.getElementById('phone');
  await new Promise(res => { ph.addEventListener('load', res, { once: true }); ph.src = target; });
  const doc = ph.contentDocument, win = ph.contentWindow;
  const started = performance.now();
  const late = () => performance.now() - started > SETTLE_TIMEOUT_MS;

  while (!(win.MathJax && win.MathJax.startup && win.MathJax.startup.promise)) {
    if (late()) return { error: 'MathJax never started in the phone view' };
    await sleep(POLL_MS);
  }
  try { await win.MathJax.startup.promise; }
  catch (e) { return { error: 'MathJax failed to typeset the phone view' }; }

  // Scroll through once. Measured without this, a too-wide equation further
  // down the page was reported as fitting; once it had been on screen it
  // measured at its true width.
  const step = Math.max(200, Math.round(win.innerHeight * 0.8));
  for (let y = 0; y < doc.documentElement.scrollHeight; y += step) {
    win.scrollTo(0, y);
    await sleep(60);
  }
  win.scrollTo(0, 0);
  if (doc.fonts) await doc.fonts.ready;

  let found, last = null, stable = 0;
  for (;;) {
    found = phoneOverflow(doc);
    const now = JSON.stringify(found);
    stable = now === last ? stable + 1 : 1;
    last = now;
    if (stable >= STABLE_POLLS) break;
    if (late()) return { error: 'phone view kept changing after ' + Math.round(SETTLE_TIMEOUT_MS / 1000) + 's' };
    await sleep(POLL_MS);
  }
  return { width: PHONE_WIDTH, pageWidth: doc.documentElement.scrollWidth, overflow: found };
}

// --- waiting for the print preview to settle ----------------------------
// PreTeXt builds the print preview after the page loads: it swaps in the
// print stylesheet, waits for it, splits the worksheet into .onepage divs,
// adds headers and footers, then scales every .workspace so each page is
// exactly full. MathJax typesets in parallel and loads its fonts after that.
// A fixed delay measured the raw layout whenever this ran late, so instead
// poll until all of it has happened and the layout has stopped changing.
const sleep = ms => new Promise(r => setTimeout(r, ms));

function layoutOf(doc) {
  // Everything the fit check depends on, rounded so sub-pixel noise is ignored.
  const parts = [];
  doc.querySelectorAll('.onepage').forEach(pg => {
    const top = pg.getBoundingClientRect().top;
    let bottom = 0;
    pg.querySelectorAll('*').forEach(el => {
      if (el.offsetParent === null || insideMath(el)) return;
      bottom = Math.max(bottom, el.getBoundingClientRect().bottom - top);
    });
    parts.push(Math.round(bottom));
    pg.querySelectorAll('.workspace').forEach(ws =>
      parts.push(Math.round(ws.getBoundingClientRect().height)));
  });
  return parts.join(',');
}

function pending(doc, win, math) {
  // What is still outstanding before the preview can be measured.
  const waiting = [];
  if (!doc.querySelector('.onepage')) waiting.push('pages');
  if (!doc.querySelector('.first-page-header')) waiting.push('headers and footers');
  // adjustWorkspaceToFitPage writes a px height to every workspace; before
  // it runs they carry the authored length (e.g. "1.2in") or nothing.
  const ws = Array.from(doc.querySelectorAll('.workspace'));
  if (ws.some(w => !/px$/.test(w.style.height))) waiting.push('workspace sizing');
  if (math !== 'done') waiting.push('MathJax (' + math + ')');
  if (doc.fonts && doc.fonts.status !== 'loaded') waiting.push('fonts');
  if (Array.from(doc.images).some(im => !im.complete)) waiting.push('images');
  return waiting;
}

function refit(doc, win) {
  // PreTeXt fits the workspaces as soon as its print stylesheet has loaded,
  // without waiting for MathJax. When typesetting finishes later (it can need
  // an extension from the CDN), the pages were fitted around raw TeX and the
  // typeset mathematics no longer fits. Re-run PreTeXt's own fit now that
  // everything is in place: it is the same call the preview makes when the
  // reader changes paper size. Returns whether the layout moved.
  if (typeof win.adjustWorkspaceToFitPage !== 'function' ||
      typeof win.toPixels !== 'function') return null;
  const printout = doc.querySelector('section.worksheet, section.handout');
  if (!printout) return null;
  const m = (printout.getAttribute('data-margins') || '').split(' ');
  const margins = { top: win.toPixels(m[0] || '0.75in'), right: win.toPixels(m[1] || '0.75in'),
                    bottom: win.toPixels(m[2] || '0.75in'), left: win.toPixels(m[3] || '0.75in') };
  const paperSize = doc.body.classList.contains('letter') ? 'letter' : 'a4';
  const before = layoutOf(doc);
  win.adjustWorkspaceToFitPage({ paperSize, margins });
  return layoutOf(doc) !== before;
}

async function settle() {
  const doc = f.contentDocument, win = f.contentWindow;
  const started = performance.now();
  const timeline = [];
  const seen = new Set();
  let math = 'script not loaded', last = null, stable = 0, polls = 0, waiting;
  let refitted = false;

  for (;;) {
    polls++;
    const ms = Math.round(performance.now() - started);
    if ((math === 'script not loaded' || math === 'not started') && win.MathJax) {
      const startup = win.MathJax.startup;
      if (startup && startup.promise) {
        math = 'typesetting';
        startup.promise.then(() => { math = 'done'; }, () => { math = 'failed'; });
      } else {
        math = 'not started';
      }
    }
    waiting = pending(doc, win, math);
    for (const w of ['pages', 'headers and footers', 'workspace sizing', 'fonts', 'images']) {
      if (!waiting.includes(w) && !seen.has(w)) { seen.add(w); timeline.push(w + ' ' + ms); }
    }
    if (math === 'done' && !seen.has('mathjax')) { seen.add('mathjax'); timeline.push('mathjax ' + ms); }
    if (math === 'failed') {
      return { error: 'MathJax failed to typeset the print preview' };
    }
    if (waiting.length === 0) {
      const now = layoutOf(doc);
      stable = now === last ? stable + 1 : 1;
      last = now;
      if (stable >= STABLE_POLLS && !refitted) {
        const moved = refit(doc, win);
        refitted = true;
        timeline.push((moved === null ? 'no refit' : moved ? 'refit moved layout' : 'refit unchanged') + ' ' + ms);
        stable = 0; last = null;
      } else if (stable >= STABLE_POLLS) {
        timeline.push('stable ' + ms);
        return { ms, polls, timeline };
      }
    } else {
      stable = 0; last = null;
    }
    if (performance.now() - started > SETTLE_TIMEOUT_MS) {
      const why = waiting.length ? 'still waiting for ' + waiting.join(', ')
                                 : 'layout kept changing';
      return { error: 'print preview did not settle after ' + Math.round(SETTLE_TIMEOUT_MS / 1000)
                      + 's: ' + why + ' (' + timeline.join('; ') + ')' };
    }
    await sleep(POLL_MS);
  }
}

f.addEventListener('load', async () => {
  if (!followed) {
    // Follow the worksheet's own print-preview link.
    const doc = f.contentDocument;
    const link = doc.querySelector('a[href*="printpreview"]');
    followed = true;
    if (link) { f.src = link.href; return; }
    report({ error: 'no printpreview link found' });
    return;
  }
  const settled = await settle();
  if (settled.error) { report(settled); return; }
  const result = measure(settled);
  result.phone = await checkPhone();
  report(result);
});
f.src = target;
</script>
</body>
</html>
